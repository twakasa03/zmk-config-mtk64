CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_EC11=y
# 2026-08-16: 一度 OWN_THREAD (優先度3) に変えたが、実機で悪化した。
# 「1ノッチずつの動きがたまに反応しない」「回し始めがさらに落ちる」と本人が申告したので戻す。
# 遅延で状態が飛んでいるという仮説は棄却する。
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- 計測用（いまは外してある）---------------------------------------------
# 残っている症状は「回し始めの1〜2ノッチが効かない」「逆回転に切り返すと1ノッチ無反応」で、
# まだ原因が取れていない。測るときは次の4行を戻して左半分だけ焼き直す。
# 左半分を USB で繋いでシリアルを読めば、ドライバの LOG_DBG("Delta: %d") と
# behavior の LOG_DBG("val1 … remainder … triggers …") が出るので、
# 1ノッチあたりのパルス数・端数の溜まり方・状態が飛んで delta=0 に落ちているかが直接 見える。
# 常用しないのは、USB のスタックとログがバッテリーに効くため。
# CONFIG_ZMK_USB=y
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_LOG_BUFFER_SIZE=8192
# ---------------------------------------------------------------------------

CONFIG_ZMK_BATTERY_REPORTING=y