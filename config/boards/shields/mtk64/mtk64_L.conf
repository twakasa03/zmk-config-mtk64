CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_EC11=y
# 2026-08-16: 共有ワークキュー (GLOBAL_THREAD) から専用スレッドへ移した。
# 症状は「回し始めの1ノッチ、稀に2ノッチが効かない」。
# ec11_sample_fetch は割り込みを受けたあと A/B の「いまの状態」を読んで前回と比べる。
# 処理が遅れて2段ぶん一度に動くと 00→11 のように飛び、この組合せは delta の表に無いので
# default に落ちて 0 になる。つまり遅れたぶんが捨てられる。
# 左半分は共有キューでマトリクスの走査と分割通信も回しているので、混むと遅れる。
# 専用スレッドにして優先度を既定の10 から3 に上げ、他の作業の後ろに並ばないようにする。
#
# これは仮説であって実測ではない。書き込んだあと「回し始めが効かない」が残るなら、
# 次は優先度を 1 か 0 まで上げるか、それでも駄目ならドライバ側の問題として切り分ける。
CONFIG_EC11_TRIGGER_OWN_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=3
CONFIG_EC11_THREAD_STACK_SIZE=1024

CONFIG_ZMK_BATTERY_REPORTING=y